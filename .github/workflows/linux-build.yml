name: Linux Build and Verification

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-linux-x64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile C bootstrap (Stage 0)
        run: |
          mkdir -p build
          gcc -std=c11 -D_DEFAULT_SOURCE src/bootstrap/*.c src/joey/joey_native.c src/joey/joey_watch.c src/joey/joey_gui.c -o build/qk_bootstrap -lm -lpthread

      - name: Verify Stage 0 binary architecture
        run: file build/qk_bootstrap | grep -q "x86-64" || (echo "Build is not x86-64" && exit 1)

      - name: Run test suite
        run: |
          cp build/qk_bootstrap build/quokka
          bash tests/run_tests.sh
          bash tests/run_differential.sh
          bash tests/test_negative.sh

      - name: Package as tarball
        if: success()
        run: |
          mkdir -p dist/quokka-linux-x64
          cp build/qk_bootstrap dist/quokka-linux-x64/quokka
          cp -r src dist/quokka-linux-x64/
          cp LICENSE README.md dist/quokka-linux-x64/
          tar -czf quokka-linux-x64.tar.gz -C dist quokka-linux-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quokka-linux-x64
          path: quokka-linux-x64.tar.gz

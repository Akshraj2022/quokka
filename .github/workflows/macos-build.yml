name: macOS Build and Verification

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-arm64:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Compile C bootstrap (Stage 0)
        run: |
          mkdir -p build
          clang -std=c11 -D_DEFAULT_SOURCE -arch arm64 src/bootstrap/*.c src/joey/joey_native.c src/joey/joey_watch.c src/joey/joey_gui.c -o build/qk_bootstrap -lpthread

      - name: Verify Stage 0 binary architecture
        run: file build/qk_bootstrap | grep -q "arm64" || (echo "Build is not arm64" && exit 1)

      - name: Run test suite
        run: |
          cp build/qk_bootstrap build/quokka
          bash tests/run_tests.sh
          bash tests/run_differential.sh
          bash tests/test_negative.sh

      - name: Package as tarball
        if: success()
        run: |
          mkdir -p dist/quokka-macos-arm64
          cp build/qk_bootstrap dist/quokka-macos-arm64/quokka
          cp -r src dist/quokka-macos-arm64/
          cp LICENSE README.md dist/quokka-macos-arm64/
          tar -czf quokka-macos-arm64.tar.gz -C dist quokka-macos-arm64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quokka-macos-arm64
          path: quokka-macos-arm64.tar.gz

  build-macos-x64:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Compile C bootstrap (Stage 0)
        run: |
          mkdir -p build
          clang -std=c11 -D_DEFAULT_SOURCE -arch x86_64 src/bootstrap/*.c src/joey/joey_native.c src/joey/joey_watch.c src/joey/joey_gui.c -o build/qk_bootstrap -lpthread

      - name: Verify Stage 0 binary architecture
        run: file build/qk_bootstrap | grep -q "x86_64" || (echo "Build is not x86_64" && exit 1)

      - name: Run test suite
        run: |
          cp build/qk_bootstrap build/quokka
          bash tests/run_tests.sh
          bash tests/run_differential.sh
          bash tests/test_negative.sh

      - name: Package as tarball
        if: success()
        run: |
          mkdir -p dist/quokka-macos-x64
          cp build/qk_bootstrap dist/quokka-macos-x64/quokka
          cp -r src dist/quokka-macos-x64/
          cp LICENSE README.md dist/quokka-macos-x64/
          tar -czf quokka-macos-x64.tar.gz -C dist quokka-macos-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: quokka-macos-x64
          path: quokka-macos-x64.tar.gz
